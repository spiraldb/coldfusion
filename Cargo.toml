[package]
name = "coldfusion"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/spiraldb/coldfusion"
description = "Parallel Iceberg table provider for DataFusion with Parquet and Vortex readers"
keywords = ["iceberg", "datafusion", "parquet", "vortex"]
categories = ["database"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "NOTICE",
    "README.md",
    "rust-toolchain.toml",
    "rustfmt.toml",
]

[dependencies]
arrow-row = "59.3.2"
async-trait = "0.1.89"
datafusion = { version = "=55.2.0", default-features = false, features = ["parquet"] }
futures = "0.3"
iceberg = { git = "https://github.com/spiraldb/iceberg-rust", rev = "a24f97231aa263bcc8f62b3ee07b32a1055cbabb", default-features = false }
moka = { version = "0.12", features = ["future"] }
parquet = "=59.3.2"
serde_json = "1"
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "sync"] }
vortex = { git = "https://github.com/vortex-data/vortex.git", rev = "32f0a47ab62157a635203b5e885740295ff86c6a", features = ["tokio"] }
vortex-datafusion = { git = "https://github.com/vortex-data/vortex.git", rev = "32f0a47ab62157a635203b5e885740295ff86c6a", default-features = false }
vortex-parquet = { git = "https://github.com/spiraldb/vortex-parquet", rev = "e2ace00f6a3ca5b1911a13edd4e455dfa3366597" }

[dev-dependencies]
# Only the Iceberg writer fixture uses Iceberg main's Vortex session type.
iceberg-vortex = { package = "vortex", version = "=0.93.0", features = ["tokio"] }
datafusion = { version = "=55.2.0", default-features = false, features = ["sql"] }
tempfile = "3.18"
tokio = { version = "1.47", default-features = false, features = ["macros"] }

[lints.rust]
unused_qualifications = "deny"
