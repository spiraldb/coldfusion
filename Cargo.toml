[package]
name = "coldfusion"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/spiraldb/coldfusion"
description = "Parallel Iceberg table provider for DataFusion with Parquet and Vortex readers"
keywords = ["iceberg", "datafusion", "parquet", "vortex"]
categories = ["database"]
include = [
    "src/**",
    "tests/**",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "NOTICE",
    "README.md",
    "rust-toolchain.toml",
    "rustfmt.toml",
]

[dependencies]
async-trait = "0.1.89"
datafusion = { version = "=55.2.0", default-features = false, features = ["parquet"] }
futures = "0.3"
iceberg = { git = "https://github.com/spiraldb/iceberg-rust", rev = "bec244141d9f6cda46406b95d5f6aa3764d84a56", default-features = false }
parquet = "=59.3.2"
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "sync"] }
vortex = { git = "https://github.com/vortex-data/vortex.git", rev = "32f0a47ab62157a635203b5e885740295ff86c6a", features = ["tokio"] }
vortex-datafusion = { git = "https://github.com/vortex-data/vortex.git", rev = "32f0a47ab62157a635203b5e885740295ff86c6a", default-features = false }

[dev-dependencies]
datafusion = { version = "=55.2.0", default-features = false, features = ["sql"] }
tempfile = "3.18"
tokio = { version = "1.47", default-features = false, features = ["macros"] }

[lints.rust]
unused_qualifications = "deny"
